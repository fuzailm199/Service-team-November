<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CQ Dashboard — November 2026</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header class="hdr">
  <img src="logo_icon.png" class="hdr-logo" alt="Caratlane">
  <div class="hdr-brand">
    <div class="hdr-name">Caratlane</div>
    <div class="hdr-tata">A Tata Product</div>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-title" id="hdr-title-text">CQ Dashboard</div>
  <div class="hdr-actions">
    <span class="hdr-badge">Quality Assurance</span>
    <button class="dm-toggle" onclick="toggleTheme()">🌙 DARK</button>
  </div>
</header>

<nav class="team-nav" id="teamNav"></nav>

<div id="team-content"></div>

<footer class="footer">
  <div class="ft-left">
    <img src="logo_icon.png" class="ft-logo" alt="Caratlane">
    <div>
      <div class="ft-brand">Caratlane</div>
      <div class="ft-tata">A Tata Product</div>
    </div>
  </div>
  <div class="ft-right">
    Quality Assurance &middot; CQ Dashboard &middot; November 2026<br>
    Audited by Fuzail &middot; SAS &middot; INTL &middot; MTO &middot; Service
  </div>
</footer>

<div id="modal-overlay">
  <div class="modal">
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="m-name"></div>
      <div id="m-role"></div>
      <div id="m-metrics"></div>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="render.js"></script>
<script src="charts.js"></script>
<script src="modal.js"></script>
<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.querySelector('.dm-toggle').textContent = isDark ? '🌙 DARK' : '☀️ LIGHT';
  }
</script>
</body>
</html>
